- name: Plateaux
  color: '#000000'
  appendix: C
  children:
    - name: Plateau Automne
      pretext: Pas de règles particulières.

    - name: Plateau Hiver
      children:
        - name: Rivière déchainée.
          text: La rivière divise les bois _(comme les chemins imprimés)_.

    - name: Plateau Lac (Monde Souterrain)
      children:
        - name: Modifications de mise en place.
          text: Placez le Radeau dans la clairière côtière du coin inférieur droit.
        - name: Le Lac.
          text: Le lac est au centre du plateau. Considérez le lac comme des rivières reliant chaque clairière côtière aux autres clairières côtières. Le lac divise les bois.
        - name: Clairières Côtières.
          text: Les clairières qui touchent le lac _(pas entourées de bois)_ sont des clairières côtières.
        - name: Bois Côtiers.
          text: Les bois qui touchent le lac sont des bois côtiers. Chaque bois côtier est adjacent aux deux bois côtiers de chaque coté _(séparés par une clairière côtière)_.
        - name: Le Radeau.
          text: Une fois par tour, lorsque vous vous déplacez depuis une clairière avec le Radeau, vous pouvez vous déplacer vers une autre clairière côtière, en ignorant les chemins. Déplacez le Radeau avec les pièces déplacées. Si des pièces de faction sont déplacées, leur joueur pioche 1 carte. _(Vous devez toujours contrôler la clairière de départ ou d'arrivée pour utiliser le Radeau, même avec la capacité Nageurs. Si des pièces de plusieurs factions sont déplacées en même temps, chacun de leurs joueurs pioche 1 carte.)_

    - name: Plateau Montagne (Monde Souterrain)
      children:
        - name: Modifications de mise en place.
          text: lacez les 6 marqueurs de chemin fermé sur les 6 chemins plus foncés creusés dans la terre. Placez la Tour dans la clairière centrale représentant deux tours.
        - name: Chemins fermés.
          text: Un chemin recouvert d'un marqueur de chemin fermé est un chemin fermé. Les clairières reliées par un chemin fermé ne sont pas adjacentes, et des pièces _(comme les Bandits des Grands Chemins)_, ne peuvent pas être placées sur des chemins fermés. Les chemins fermés encadrent et divisent les bois comme s’il s’agissait de chemins _(le Vagabond peut donc se faufiler d'un bois à l’autre à travers ce chemin)_.
        - name: Retirer des chemins fermés.
          text: Une fois par tour lors du Jour, un joueur peut dépenser une carte pour retirer un marqueur de chemin fermé de la partie définitivement et marquer 1 point de victoire. Pour le retirer, ce joueur doit posséder au moins 1 pièce de faction dans l’une ou l’autre des clairières reliées par le marqueur de chemin fermé.
        - name: Le Col et la Tour.
          text: Le Col est la clairière marquée par la Tour. À la fin du Crépuscule d'un joueur, si celui-ci contrôle le Col, il marque 1 point de victoire.
        - name: Forests.
          text: Toutes les zones du plateau Montagne fermées par des chemins et des clairières sont des bois, que des arbres y soient représentés ou non.

    - name: Plateau Marais (Terre Natale)
      children:
        - name: Modifications de mise en place.
          text: Suivez la sous-section relative à votre nombre de joueurs. Placez ensuite 2 ruines sur les emplacements "R" sans numéro et 2 ruines sur les emplacements "R" avec les plus petits numéros.
          children:
            - name: 1–4 Joueurs.
              text: Recouvrez 3 des clairières inondables avec des marqueurs d'inondation de couleur correspondante (un vert clair, un vert foncé et un marron). Alignez les chemins des marqueurs d'inondation avec les chemins qui touchent le marqueur.
            - name: 5+ Joueurs.
              text: Placez les Monuments Fort-Souris, Renardière et Bourg-Lapin dans les trois clairières sans couleur. _(Vous pouvez tout de même placer d'autres Monuments normalement.)_
        - name: Clairières inondées.
          text: Une clairière inondée n'est plus une clairière. Elle ne contient plus qu'un ou plusieurs chemins, et peut comporter un chemin inondé. Les clairières reliées par des chemins non-inondés de ces clairières sont adjacentes.
          children:
            - name: Chemins inondés.
              text: Les chemins inondés ne sont pas reliés aux autres chemins, mais ils entourent et divisent les bois comme les autres chemins _(le Vagabond peut donc les franchir en se faufilant)_.
            - name: Placer sur les chemins.
              text: Les pièces pouvant être placées sur les chemins _(comme les Bandits des Grands Chemins)_ peuvent être placées sur n'importe quel chemin non-inondé d'une clairière, mais pas à une intersection de chemins.

    - name: Plateau Gorge (Terre Natale)
      children:
        - name: Le barrage.
          text: Le barrage divise les bois qu'il traverse.
        - name: Le pont.
          text: Le pont est un chemin. Le pont ne divise pas les bois qu'il traverse.
        - name: Falaises de la gorge.
          text: Les falaises de la gorge ne divisent pas les bois qu'elles parcourent.

- name: Vagabonds
  color: '#000000'
  appendix: D
  children:
    - name: Voleur
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:torch`, `item:tea`, `item:sword`.
        - name: 'Action spéciale : Larcin.'
          text: Épuisez une `item:torch` pour prendre une carte au hasard dans la main d’un joueur de votre clairière.

    - name: Bricoleur
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:torch`, `item:sack`, `item:hammer`.
        - name: 'Action spéciale : Travailleur.'
          text: Épuisez une `item:torch` pour prendre une carte de la défausse de la même couleur que votre clairière. _(Vous pouvez toujours prendre une carte Oiseau.)_

    - name: Rôdeur
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:torch`, `item:crossbow`, `item:sword`.
        - name: 'Action spéciale : Refuge.'
          text: Épuisez une `item:torch` pour réparer 3 objets. Mettez ensuite immédiatement fin au Jour et passez au Crépuscule.

    - name: Miséreux (Compagnie de la Rivière)
      children:
        - name: Objets de départ.
          text: Commence avec `item:coin`, `item:torch`, `item:boot`.
        - name: 'Action spéciale : Provocation.'
          text: Épuisez une `item:torch` pour forcer un joueur _(même vous)_ à combattre un joueur dans votre clairière. Considérez les bâtiments et les jetons retirés comme retirés par vous-même. _(Marquez 1 point de victoire par bâtiment ou jeton retiré de chaque joueur. Marquez normalement pour l'Infamie.)_

    - name: Médiateur (Compagnie de la Rivière)
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:torch`, `item:sword`, `item:sword`.
        - name: 'Action spéciale : Protection.'
          text: En défendant en combat, avant le lancer de dés, une faction peut enrôler le Médiateur s'il est dans la clairière du combat. Le Médiateur marque alors 1 point de victoire et ajoute toutes ses `item:sword` intactes au maximum de pertes infligées par le défenseur. Le Médiateur ne peut pas s’enrôler lui-même ou être enrôlé contre lui-même.

    - name: Brigand (Compagnie de la Rivière)
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:boot`, `item:torch`, `item:crossbow`.
        - name: 'Action spéciale : Terre brûlée.'
          text: Épuisez une `item:torch` et placez-la dans votre clairière pour retirer toutes les pièces adverses de cette clairière. Les pièces ne peuvent plus être placées ou déplacées dans la clairière avec la `item:torch`. _(Vous restez dans cette clairière. Une fois que vous en sortez, vous ne pouvez plus y entrer. La `item:torch` ne peut pas être retirée avec une carte « Faveur des... », car il ne s’agit pas d’une pièce adverse.)_

    - name: Aventurier (Monde Souterrain)
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:torch`, `item:hammer`.
        - name: 'Action spéciale : Improvisation.'
          text: Une fois par tour, lorsque vous effectuez l’action Quête, vous pouvez considérer un objet non épuisé comme s'il s’agissait de n'importe quel autre objet. Lorsque vous épuisez cet objet pour accomplir la quête, endommagez-le aussi.

    - name: Chasseur (Monde Souterrain)
      children:
        - name: Objets de départ.
          text: Commence avec `item:coin`, `item:torch`, `item:sword`, `item:crossbow`.
        - name: 'Special Action: Glide.'
          text: Épuisez une `item:torch` pour déplacer uniquement votre pion Vagabond _(pas d’autres pièces)_ dans n’importe quelle clairière _(même Hostile)_ du plateau sans épuiser de `item:boot`.

    - name: Ronin (Monde Souterrain)
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:boot`, `item:torch`, `item:sword`.
        - name: 'Action spéciale : Frappe rapide.'
          text: Vous pouvez épuiser une `item:sword` pour infliger 1 perte additionnelle au combat _(après avoir lancé les dés)_.

    - name: Tricheur (Terre Natale)
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:tea`, `item:crossbow`, `item:torch`.
        - name: 'Action spéciale : Escroquerie.'
          text: Une fois par tour, vous pouvez compléter une quête en épuisant 2 objets au choix au lieu des objets indiqués. _(Piochez ou marquez normalement, puis piochez une nouvelle quête.)_ Mélangez ensuite la quête complétée dans le paquet de quêtes.

    - name: Gladiateur (Terre Natale)
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:torch`, `item:hammer`.
        - name: 'Action spéciale : Duel.'
          text: Vous pouvez épuiser un objet, l'endommager, puis retirer 1 guerrier adverse de la clairière du Gladiateur pour piocher 1 carte. L'adversaire ne devient pas Hostile.

    - name: Geôlier (Terre Natale)
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:crossbow`, `item:torch`.
        - name: 'Action spéciale : Coercision.'
          text: Une fois par tour, vous pouvez dépenser une carte correspondant à la clairière du Geôlier pour considérer avoir épuisé n’importe quel objet. Après l'action qu'il déclenche ou complète, perdez 1 point de victoire. Cette action peut être intervenir pendant les actions de votre tour. _(Vous pouvez l'utiliser pour réparer, fabriquer, aider, compléter une quête, et acheter des services à la Compagnie de la Rivière.)_

- name: Nomades
  appendix: E
  color: '#000000'
  children:
    - name: Gagner et perdre des Nomades
      children:
        - name: Gagner des Nomades de la réserve.
          text: Lorsque le marqueur de score d’un joueur entre dans une case avec un marqueur de Nomade, il le prend et le place sous son Crépuscule _(pour ne pas l’oublier)_. À la fin de son tour, il prend une carte Nomade de la réserve, lance le dé de supervision et retourne son marqueur de Nomade.
        - name: Lancer le dé de supervision.
          text: Lorsqu’un joueur gagne une carte Nomade, il lance le dé de supervision et place autant de marqueurs de supervision sur la carte Nomade que le résultat du dé. Le joueur ne compte que les étoiles dorées s’il a le plus de points de victoire (ou qu’il est à égalité pour le plus de points de victoire). Sinon, il compte toutes les étoiles _(et ce même s’il a activé une carte Domination)_.
        - name: Gaining from Another Player.
          text: At the end of a player's turn, they must remove one control marker from each hireling card they gained on previous turns. Then, they must give each hireling card they control that has no control markers, along with a hireling marker, to any other player _(even the player with the highest score)_. That player puts the hireling marker below their Evening _(as a reminder)_ and immediately rolls for control.

    - name: Capacités et Actions
      pretext: Les Nomades possèdent de nombreuses actions et capacités représentées par des icônes spécifiques. Les actions et capacités qui commencent par le terme « Superviseur » sont octroyées au joueur qui supervise le Nomade.
      children:
        - name: Action de ralliement (`hireling:whenhired`).
          text: Le superviseur doit effectuer cette action lorsqu’il obtient le Nomade.
        - name: Capacité (`hireling:ability`).
          text: Cette capacité est toujours active ou indique les moments où elle se déclenche.
        - name: Action de début d’Aurore (`hireling:birdsong`).
          text: Au début de son Aurore, le joueur qui supervise le Nomade peut ou doit effectuer cette action, en se référant à sa description.
        - name: Action à effectuer une fois par Jour (`hireling:daylight`).
          text: Le joueur qui supervise le Nomade peut effectuer cette action une fois par Jour.

    - name: Règles
      children:
        - name: Contrôle.
          text: Le superviseur d’un Nomade ne considère les pièces Nomades comme les siennes que pour déterminer le contrôle des clairières. _(Le superviseur peut contrôler une clairière sur laquelle il ne possède que des pièces Nomades.)_ Les Nomades qui ne sont supervisés par aucun joueur peuvent contrôler une clairière comme s'ils étaient des joueurs.
        - name: Adversaire.
          text:Un Nomade est considéré comme adversaire par tous les joueurs autres que son superviseur ou les joueurs ayant formé une coalition avec son superviseur.
        - name: Pièces indépendantes.
          text: Les pièces Nomades ne sont pas des pièces de la faction du superviseur. _(Le Duché ne les considère donc pas comme des pièces du Duché qu'il pourrait utiliser pour rallier des ministres, les Gardiens ne peuvent pas les retirer pour Établir un camp, etc.)_
        - name: Actions indépendantes.
          text: Les actions Déplacement ou Combat d'un Nomade ne peuvent être effectuées qu’avec des pièces Nomades, et ne peuvent pas inclure de pièces du superviseur. Les Nomades ne peuvent pas effectuer d’actions d’une autre manière _(ils ne peuvent par exemple pas bénéficier des actions de Déplacement du superviseur, de la carte Directives erronnées, ou du Statut d’allié du Vagabond)_.
        - name: Effets indépendants.
          text: Les Nomades ne peuvent pas utiliser les capacités de leur superviseur, de leurs effets persistants fabriqués, ni de leurs cartes Embuscade. _(Un Nomade ne peut donc pas utiliser Constructeur naval lorsqu’il se déplace, et les Bandits des Grands Chemins ne peuvent pas être placés sur une rivière. Le superviseur d’un Nomade ne peut pas jouer de carte Embuscade lorsqu’il combat avec le Nomade.)_
        - name: Pas de points pour les pièces retirées.
          text: Le superviseur d’un Nomade ne marque pas de points de victoire si son Nomade retire une pièce adverse _(en combat généralement)_. _(Les joueurs peuvent toujours marquer des points en retirant des bâtiments et des jetons Nomades, même lorsqu’ils sont le défenseur lors d’un combat contre un Nomade. Les joueurs marquent toujours des points normalement si les Prophètes du Soleil forcent les pièces de faction de ce joueur à se battre.)_
        - name: Règles étranges.
          text: Si vous déplacez des guerriers Nomades dans une clairière dans laquelle se trouve un jeton de Sympathie de l’Alliance, ou que vous retirez un jeton de Sympathie de l’Alliance grâce à un Nomade, cela déclenche leur Indignation. _(Ces effets se réfèrent à « un joueur qui déplace » ou « un joueur qui retire ».)_

- name: Monuments
  color: '#000000'
  appendix: F
  children:
    - name: Règles Générales
      children:
      - name: Sécurité.
        text: Les Monuments ne peuvent pas être combattus, déplacés, retirés ou couverts, sauf mention contraire explicite sur la carte du Monument.
      - name: Possession.
        text: Aucune faction ne possède les Monuments. Ce ne sont pas non plus des pièces adverses.

- name: Glossaire
  color: '#000000'
  appendix: G
  children:
    - name: Adjacence
      pretext: Une clairière est adjacente à toute autre clairière qui lui est reliée par un chemin. Un bois est adjacent à toute clairière qui le touche sans traverser un chemin imprimé, et adjacent à toute bois dont il est seulement séparé par un seul chemin, sauf sur le Lac (`rule:25.3.4`).

    - name: Adversaire
      pretext: Tout autre joueur avec lequel vous n’avez pas formé de coalition (`rule:9.2.8`), ou tout Nomade qui se trouve dans la réserve ou qui est supervisé par un joueur adverse.

    - name: Aire de jeu
      pretext: Espace entourant votre plateau de faction. Les cartes qui s’y trouvent ne peuvent être dépensées, défaussées ou utilisées que conformément aux règles y faisant référence.

    - name: Bâtiment
      pretext: Pièce en carton carrée qui appartient à sa faction.

    - name: Bois
      pretext: Zone du plateau entourée de chemins et de clairières.

    - name: Bord du plateau
      pretext: La chaîne de clairières et de chemins qui déterminent les limites du plateau, y compris les Chemins fermés du plateau Montagne.

    - name: Capacité
      pretext: Effet persistant d’une faction comme indiqué au sommet de son plateau de faction et dans la section Règles et capacités de la faction, ou effet persistant d’un Nomade, comme indiqué sur sa carte Nomade (`rule:22.2.2`).

    - name: Chemin
      pretext: Ligne blanche reliant deux clairières

    - name: Considérer
      pretext: La chose indiquée prend les propriétés de la seconde chose indiquée. Lorsque vous considérez des pièces adverses comme les vôtres concernant le contrôle des clairières, ce ne sont pas des pièces adverses, mais elles sont toujours des pièces de factions appartenant à ce joueur adverse. _(Par exemple, le guerriers de la Compagnie de la Rivière que vous avez engagés comme mercenaires ne sont pas des pièces adverses, mais ce sont toujours de pièces de faction de la Compagnie.)_

    - name: Contrôle
      pretext: Voir `rule:2.5`.

    - name: Correspondant
      pretext: De la même couleur.

    - name: Défausser
      pretext: Placer la carte indiquée dans la défausse commune (`rule:2.1`). S’il s’agit d'une carte Domination, la placer à côté du plateau à la place (`rule:3.3.3`). `faction:cult$10.2.6` `faction:diaspora$16.2.3`

    - name: Dépenser
      pretext: Voir **Défausser**. _(Ces termes sont interchangeables, mais **dépenser** est utilisé lorsqu’un choix peut être fait.)_

    - name: Échanger
      pretext: Intervertir l’emplacement des deux pièces indiquées. _(Cet effet ignore les restriction des effets **déplacer** et **placer**, telles que les Pièges des Corvidés et le Donjon de la Marquise.)_

    - name: Effet
      pretext: Tout ce qui modifie la partie ou les règles, y compris les effets persistants, les capacités de faction et les actions.

    - name: Emplacement
      pretext: Case blanche dans une clairière `rule:2.2.3`.

    - name: Forcer
      pretext: Voir `rule:1.5.5`.

    - name: Guerrier
      pretext: Figurine de bois qui appartient à sa faction ou à des Nomades. _(Le pion Vagabond n’est pas un guerrier et ne peut pas être retiré.)_

    - name: Hasard
      pretext: Lorsqu’il s’agit d’une carte, prenez-en une au hasard sans regarder les cartes.

    - name: Jeton
      pretext: Pièce en carton ronde qui appartient à sa faction ou à des Nomades.

    - name: Montrer
      pretext: Laisser le joueur indiqué voir la pièce indiquée.

    - name: Ne Peut Pas
      pretext: Voir `rule:1.1.2`.

    - name: Objet
      pretext: Pièce en carton carrée montrant un objet (`item:boot`, `item:sword`, `item:crossbow`, etc.) qui n’appartient à aucune faction.

    - name: Pièce
      pretext: Any component—building, token, warrior, pawn, item, marker, and so on.

    - name: Pièce adverse
      pretext: Pièce de faction d’un adversaire ou pièce Nomade d’un Nomade adverse, sauf si vous considérez cette pièce comme une des vôtres concernant le contrôle de clairière _(Mercenaires de la Compagnie de la Rivière, Nomades supervisés, etc)_. _(Les Objets ne peuvent pas être des pièces adverse.)_

    - name: Pièce de faction
      pretext: Tous les guerriers, pions, bâtiments et jetons listés au dos d’un plateau de faction. _(Les Objets ne sont pas des pièces de faction)_. Voir `rule:1.5.1`.

    - name: Piocher
      pretext: Prenez une carte dans votre main. Si elle est prise d’une pile ou d’une pioche, prenez la carte du dessus, sauf indication contraire. Si la source n’est pas précisée, prenez-la dans la pioche commune (`rule:2.1`). `faction:diaspora$16.2.3.1`

    - name: Pion
      pretext: Figurine de bois qui appartient à sa faction ou à des Nomades.

    - name: Placer
      pretext: Prendre la pièce indiquée à l’endroit indiqué et la mettre à l’endroit indiqué. L’endroit où prendre la pièce n’est pas toujours indiqué, il faut alors la prendre dans sa réserve, ou prendre la pièce correspondante la plus à gauche de sa piste. Mettre signifie Placer.

    - name: Plateau
      pretext: Voir `rule:2.2`.

    - name: Remplacer
      pretext: Retirer la pièce indiquée et placer l'autre pièce indiquée à l’endroit où se trouvait la première pièce avant d’être retirée. Pour faire ceci, vous devez impérativement effectuer les deux étapes. _(Par exemple, les adversaires de la Marquise ne peuvent pas remplacer un guerrier de la Marquise sur le Donjon.)_

    - name: Réserve
      pretext: Ensemble de pièces qui ne se trouve pas sur un plateau de faction ni sur le plateau. La réserve d’objets est l’ensemble d’objets sur le plateau.

    - name: Retirer
      pretext: Prendre la pièce indiquée à l’endroit indiqué et la remettre à l’endroit indiqué. L’endroit où remettre la pièce n’est pas toujours indiqué, il faut alors la remettre dans la réserve de son propriétaire, la replacer sur la case vide la plus à droite de sa piste (le cas échéant) ou alors la retirer définitivement du jeu. _(Les objets doivent toujours être retirés définitivement.)_

    - name: Révéler
      pretext: Placer la carte indiquée face visible dans votre aire de jeu. L’endroit d’où provient la carte n’est généralement pas indiqué, il s’agit alors d'une carte de votre main.

    - name: Rivière
      pretext: Ligne bleue reliant deux clairières.

    - name: Ruine
      pretext: Pièce recouvrant une case "R" dans une clairière (`rule:2.2.4`).

- name: Capitaines Gredins
  color: '#000000'
  appendix: H
  children:
    - name: Voleur
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:sack`.
        - name: Capacité.
          text: Après avoir Dérobé, vous pouvez déplacer le Voleur.

    - name: Bricoleur
      children:
        - name: Objets de départ.
          text: Commence avec `item:sack`, `item:hammer`.
        - name: Capacité.
          text: Après un Service, piochez 1 carte.

    - name: Rôdeur
      children:
        - name: Objets de départ.
          text: Commence avec `item:sword`, `item:crossbow`.
        - name: Capacité.
          text: Une fois par tour, en guise d’action, vous pouvez épuiser l’objet de votre choix pour effectuer un Assaut, une Escarmouche ou une Rafle.

    - name: Miséreux
      children:
        - name: Objets de départ.
          text: Commence avec `item:tea`, `item:coin`.
        - name: Capacité.
          text: Une fois par tour, en guise d’action, vous pouvez épuiser l’objet de votre choix pour effectuer Festivités, Offrande ou Service.

    - name: Médiateur
      children:
        - name: Objets de départ.
          text: Commence avec `item:sword`, `item:coin`.
        - name: Capacité.
          text: Lors d’un Assaut, vous pouvez subir 1 perte additionnelle en combat pour infliger 1 perte additionnelle. _(Faites ceci après avoir lancé les dés.)_

    - name: Brigand
      children:
        - name: Objets de départ.
          text: Commence avec `item:crossbow`, `item:tea`.
        - name: Capacité.
          text: Lors d’une Escarmouche, vous pouvez plutôt vous déplacer d’une clairière avant de combattre. Si vous le faites, n’ignorez pas 1 perte.

    - name: Aventurier
      children:
        - name: Objets de départ.
          text: Commence avec `item:hammer`, `item:coin`.
        - name: Capacité.
          text: Après avoir placé une Ovation sur une ruine, piochez 1 carte.

    - name: Chasseur
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:crossbow`.
        - name: Capacité.
          text: Lors d’une Ruée, vous pouvez déplacer le Chasseur jusqu’à trois fois _(au lieu de deux)_, en ignorant le contrôle.

    - name: Ronin
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:sword`.
        - name: Capacité.
          text: Lors d’un Assaut, vous pouvez déplacer le Ronin avant de combattre.

    - name: Tricheur
      children:
        - name: Objets de départ.
          text: Commence avec `item:boot`, `item:tea`.
        - name: Capacité.
          text: En guise d’action, vous pouvez épuiser 2 objets pour effectuer l’action d’objet de votre choix.

    - name: Gladiateur
      children:
        - name: Objets de départ.
          text: Commence avec `item:sword`, `item:hammer`.
        - name: Capacité.
          text: Lors d’un Assaut, piochez 1 carte au début du combat.

    - name: Geôlier
      children:
        - name: Objets de départ.
          text: Commence avec `item:crossbow`, `item:sack`.
        - name: Capacité.
          text: Lors d’une Rafle, vous pouvez infliger 1 perte de moins en combat pour ignorer 1 perte. _(Faites ceci après avoir lancé les dés.)_
